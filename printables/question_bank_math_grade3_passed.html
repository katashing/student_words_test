<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>三年级数学已过关错题库</title>
  <style>
    body {
      margin: 0;
      color: #1f2933;
      font-family: "PingFang SC", "Microsoft YaHei", "Heiti SC", Arial, sans-serif;
      background: #f7f9fb;
      font-size: 14px;
      line-height: 1.45;
    }
    main {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 24px 0 40px;
    }
    h1 { margin: 0 0 6px; font-size: 26px; }
    h2 {
      margin: 24px 0 8px;
      padding-bottom: 5px;
      border-bottom: 2px solid #d9e2ec;
      font-size: 19px;
    }
    p { margin: 0 0 16px; color: #52606d; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
    }
    th, td {
      border: 1px solid #d9e2ec;
      padding: 7px 8px;
      text-align: left;
      vertical-align: top;
    }
    th { background: #eef2f6; }
    .id { white-space: nowrap; font-family: Arial, Helvetica, sans-serif; }
    .prompt { font-weight: 800; }
    .status { white-space: nowrap; }
    .thumb {
      max-width: 220px;
      max-height: 160px;
      object-fit: contain;
      border: 1px solid #d9e2ec;
      background: #fff;
    }
    .empty {
      padding: 18px;
      border: 1px solid #d9e2ec;
      background: #fff;
      color: #52606d;
    }
  </style>
</head>
<body>
  <main>
    <h1>三年级数学已过关错题库</h1>
    <p>每日数学错题只从本年级待练库抽取，最多 4 组；已过关题不再抽取。共 6 组，待练 6 组，已过关 0 组。 整理日期：2026-09-20</p>
    <div class="empty">暂无题目。</div>
  </main>
</body>
</html>
